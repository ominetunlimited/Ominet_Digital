<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ominet-style-reference-title ominet-style-reference-desc" xmlns:c2pa="http://c2pa.org/manifest"><title id="ominet-style-reference-title">Ominet Digital colour and style reference</title><desc id="ominet-style-reference-desc">Palette, proportions, signature motif and usage rules for the Ominet Digital illustration system.</desc><defs><linearGradient id="ominet-grad-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05E3F8"/><stop offset="1" stop-color="#0B8FD6"/></linearGradient><linearGradient id="ominet-grad-r" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9CD62"/><stop offset="1" stop-color="#E25868"/></linearGradient><linearGradient id="ominet-grad-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8C0DF0"/><stop offset=".55" stop-color="#C13BE8"/><stop offset="1" stop-color="#E64770"/></linearGradient><linearGradient id="ominet-grad-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F39154"/><stop offset="1" stop-color="#E25868"/></linearGradient></defs><rect x="0" y="0" width="1200" height="900" fill="#F6F4FA"/><text x="60" y="90" fill="#160E3D" font-family="Georgia,serif" font-size="44">Ominet Digital visual system</text><text x="60" y="126" fill="#0B8FD6" font-family="Helvetica,Arial,sans-serif" font-size="18">Creative Solutions. Professional Excellence.</text><text x="60" y="152" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="15">Colour</text><rect x="60" y="170" width="150" height="150" fill="#160E3D" rx="0" stroke="#160E3D" stroke-width="1"/><text x="72" y="262" fill="#F6F4FA" font-family="Georgia,serif" font-size="15">Indigo</text><text x="72" y="284" fill="#F6F4FA" font-family="Helvetica,Arial,sans-serif" font-size="13">#160E3D</text><rect x="222" y="170" width="150" height="150" fill="#F6F4FA" rx="0" stroke="#160E3D" stroke-width="1"/><text x="234" y="262" fill="#160E3D" font-family="Georgia,serif" font-size="15">Soft Ivory</text><text x="234" y="284" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="13">#F6F4FA</text><rect x="384" y="170" width="150" height="150" fill="#F8E9E0" rx="0" stroke="#160E3D" stroke-width="1"/><text x="396" y="262" fill="#160E3D" font-family="Georgia,serif" font-size="15">Warm Blush</text><text x="396" y="284" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="13">#F8E9E0</text><rect x="546" y="170" width="150" height="150" fill="#02C8ED" rx="0" stroke="#160E3D" stroke-width="1"/><text x="558" y="262" fill="#160E3D" font-family="Georgia,serif" font-size="15">Cyan</text><text x="558" y="284" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="13">#02C8ED</text><rect x="708" y="170" width="150" height="150" fill="#0B8FD6" rx="0" stroke="#160E3D" stroke-width="1"/><text x="720" y="262" fill="#F6F4FA" font-family="Georgia,serif" font-size="15">Azure</text><text x="720" y="284" fill="#F6F4FA" font-family="Helvetica,Arial,sans-serif" font-size="13">#0B8FD6</text><rect x="870" y="170" width="150" height="150" fill="#DDF6FD" rx="0" stroke="#160E3D" stroke-width="1"/><text x="882" y="262" fill="#160E3D" font-family="Georgia,serif" font-size="15">Cyan Mist</text><text x="882" y="284" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="13">#DDF6FD</text><rect x="1032" y="170" width="150" height="150" fill="#F9CD62" rx="0" stroke="#160E3D" stroke-width="1"/><text x="1044" y="262" fill="#160E3D" font-family="Georgia,serif" font-size="15">Amber</text><text x="1044" y="284" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="13">#F9CD62</text><text x="60" y="356" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="15">Accents, used sparingly</text><circle cx="78" cy="386" r="20" fill="#8C0DF0" stroke="#160E3D" stroke-width="1"/><circle cx="132" cy="386" r="20" fill="#E64770" stroke="#160E3D" stroke-width="1"/><circle cx="186" cy="386" r="20" fill="#E25868" stroke="#160E3D" stroke-width="1"/><circle cx="240" cy="386" r="20" fill="#F39154" stroke="#160E3D" stroke-width="1"/><circle cx="294" cy="386" r="20" fill="#F9CD62" stroke="#160E3D" stroke-width="1"/><text x="60" y="450" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="15">Proportion: indigo and ivory lead. Cyan, violet, magenta and orange come from the logo and appear as one idea, not all at once.</text><rect x="60" y="470" width="380" height="26" fill="#160E3D" stroke="#160E3D" stroke-width="1"/><rect x="440" y="470" width="250" height="26" fill="#F6F4FA" stroke="#160E3D" stroke-width="1"/><rect x="690" y="470" width="190" height="26" fill="#02C8ED" stroke="#160E3D" stroke-width="1"/><rect x="880" y="470" width="80" height="26" fill="#0B8FD6" stroke="#160E3D" stroke-width="1"/><rect x="960" y="470" width="70" height="26" fill="#8C0DF0" stroke="#160E3D" stroke-width="1"/><rect x="1030" y="470" width="50" height="26" fill="#E64770" stroke="#160E3D" stroke-width="1"/><rect x="1080" y="470" width="40" height="26" fill="#F39154" stroke="#160E3D" stroke-width="1"/><rect x="1120" y="470" width="20" height="26" fill="#F9CD62" stroke="#160E3D" stroke-width="1"/><g id="motif-light"><g class="ominet-signature" transform="translate(-33.10 479.00) scale(0.2414)"><polygon points="500,378 800,552 737,590 570,500 570,825 500,785" fill="url(#ominet-grad-l)"/><polygon points="1100,378 800,552 863,590 1030,500 1030,825 1100,785" fill="url(#ominet-grad-r)"/><path fill-rule="evenodd" fill="url(#ominet-grad-h)" d="M800 552 L975 650 L975 860 L800 957 L625 860 L625 650Z M800 632 L900 690 L900 825 L800 885 L695 825 L695 690Z"/><polygon points="625,775 695,815 800,885 868,915 800,957 625,860" fill="#05E3F8"/><polygon points="900,825 975,860 800,957 868,915 800,885" fill="url(#ominet-grad-b)"/></g></g><rect x="280" y="560" width="200" height="160" fill="#160E3D"/><g id="motif-dark"><g class="ominet-signature" transform="translate(214.48 502.00) scale(0.2069)"><polygon points="500,378 800,552 737,590 570,500 570,825 500,785" fill="url(#ominet-grad-l)"/><polygon points="1100,378 800,552 863,590 1030,500 1030,825 1100,785" fill="url(#ominet-grad-r)"/><path fill-rule="evenodd" fill="url(#ominet-grad-h)" d="M800 552 L975 650 L975 860 L800 957 L625 860 L625 650Z M800 632 L900 690 L900 825 L800 885 L695 825 L695 690Z"/><polygon points="625,775 695,815 800,885 868,915 800,957 625,860" fill="#05E3F8"/><polygon points="900,825 975,860 800,957 868,915 800,885" fill="url(#ominet-grad-b)"/></g></g><g id="motif-small"><g class="ominet-signature" transform="translate(466.21 561.80) scale(0.1172)"><polygon points="500,378 800,552 737,590 570,500 570,825 500,785" fill="url(#ominet-grad-l)"/><polygon points="1100,378 800,552 863,590 1030,500 1030,825 1100,785" fill="url(#ominet-grad-r)"/><path fill-rule="evenodd" fill="url(#ominet-grad-h)" d="M800 552 L975 650 L975 860 L800 957 L625 860 L625 650Z M800 632 L900 690 L900 825 L800 885 L695 825 L695 690Z"/><polygon points="625,775 695,815 800,885 868,915 800,957 625,860" fill="#05E3F8"/><polygon points="900,825 975,860 800,957 868,915 800,885" fill="url(#ominet-grad-b)"/></g></g><g id="motif-tiny"><g class="ominet-signature" transform="translate(605.86 603.20) scale(0.0552)"><polygon points="500,378 800,552 737,590 570,500 570,825 500,785" fill="url(#ominet-grad-l)"/><polygon points="1100,378 800,552 863,590 1030,500 1030,825 1100,785" fill="url(#ominet-grad-r)"/><path fill-rule="evenodd" fill="url(#ominet-grad-h)" d="M800 552 L975 650 L975 860 L800 957 L625 860 L625 650Z M800 632 L900 690 L900 825 L800 885 L695 825 L695 690Z"/><polygon points="625,775 695,815 800,885 868,915 800,957 625,860" fill="#05E3F8"/><polygon points="900,825 975,860 800,957 868,915 800,885" fill="url(#ominet-grad-b)"/></g></g><text x="60" y="552" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="15">The signature</text><text x="60" y="760" fill="#160E3D" font-family="Georgia,serif" font-size="17">Two angular ribbons form an M and an N around a hexagonal O: ideas becoming finished work.</text><text x="60" y="788" fill="#160E3D" font-family="Georgia,serif" font-size="17">Use it small and let it live inside the composition. Never paste it as a logo stamp.</text><text x="60" y="830" fill="#0B8FD6" font-family="Helvetica,Arial,sans-serif" font-size="15">Type: Georgia for display, a clean humanist sans for text. Artwork carries no text labels.</text><text x="60" y="856" fill="#0B8FD6" font-family="Helvetica,Arial,sans-serif" font-size="15">Avoid: stock icons, 3D, glass effects, neon, heavy gradients, repeated layouts in new colours.</text><g id="service-ratio"><rect x="820" y="560" width="320" height="140" fill="#DDF6FD" opacity="0.6"/><text x="836" y="590" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="14">Service cards 640 x 480</text><text x="836" y="614" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="14">Portfolio 800 x 600 or 960 x 540</text><text x="836" y="650" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="14">Image slots are groups named image-slot-*</text><text x="836" y="672" fill="#160E3D" font-family="Helvetica,Arial,sans-serif" font-size="14">Swap each for a real image element of equal size.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>