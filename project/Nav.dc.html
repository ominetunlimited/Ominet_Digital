    </button>
    <button type="button" class="btn btn-primary">SUBSCRIBE</button>

  <button type="button" class="omd-toggle" aria-label="Open menu" aria-expanded="{{ menuOpenAttr }}" onClick="{{ toggleMenu }}" style="margin-left:auto;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-8);">
      <span style="font-weight:700;letter-spacing:0.02em;color:#fff;">OMINET DIGITAL</span>
      <button type="button" class="btn btn-ghost btn-icon" aria-label="Close menu" onClick="{{ toggleMenu }}" style="color:#eafaf0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="display:grid;gap:var(--space-6);font-size:22px;font-family:var(--font-heading);">
      <div>
        <div style="font-size:11px;font-family:var(--font-body);letter-spacing:0.1em;opacity:0.5;margin-bottom:var(--space-2);">CONTENT</div>
        <div style="display:grid;gap:var(--space-3);">
          <a href="Home.dc.html">Home</a>
          <a href="OminiNfawa.dc.html">Omini Nfawa</a>
          <a href="Writing.dc.html">Writing</a>
          <a href="Books.dc.html">Books</a>
          <a href="Media.dc.html">Media</a>
        </div>
      </div>
      <div class="hr"></div>
      <div>
        <div style="font-size:11px;font-family:var(--font-body);letter-spacing:0.1em;opacity:0.5;margin-bottom:var(--space-2);">ECOSYSTEM</div>
        <div style="display:grid;gap:var(--space-3);">
          <a href="Profile.dc.html">PROFILE</a>
          <a href="CortexaOffice.dc.html">Cortexa Office</a>
          <a href="Store.dc.html">Store</a>
        </div>
      </div>
      <div class="hr"></div>
      <div>
        <div style="font-size:11px;font-family:var(--font-body);letter-spacing:0.1em;opacity:0.5;margin-bottom:var(--space-2);">ABOUT</div>
        <div style="display:grid;gap:var(--space-3);">
          <a href="About.dc.html">About</a>
          <a href="Search.dc.html">Search</a>
        </div>
      </div>
      <div class="hr"></div>
      <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:14px;font-family:var(--font-body);">
        <button type="button" class="btn btn-primary">Subscribe</button>
        <button type="button" class="btn btn-secondary" onClick="{{ toggleTheme }}">Toggle dark mode</button>
      </div>
      <div style="display:flex;gap:var(--space-4);font-size:13px;font-family:var(--font-body);opacity:0.6;">
        <span>Facebook</span><span>X</span><span>LinkedIn</span>
      </div>
    </div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false, theme: "light" };
  componentDidMount() {
    const saved = localStorage.getItem("omd-theme") || "light";
    document.documentElement.setAttribute("data-theme", saved);
    this.setState({ theme: saved });
    this._onKey = (e) => { if (e.key === "Escape" && this.state.menuOpen) this.setState({ menuOpen: false }); };
    window.addEventListener("keydown", this._onKey);
  }
  componentWillUnmount() {
    window.removeEventListener("keydown", this._onKey);
  }
  renderVals() {
    const a = this.props.active || "";
    const cur = (name) => (a === name ? "page" : undefined);
    return {
      curOmini: cur("ominiNfawa"),
      curWriting: cur("writing"),
      curBooks: cur("books"),
      curMedia: cur("media"),
      curProfile: cur("profile"),
      curCortexa: cur("cortexa"),
      curAbout: cur("about"),
      menuOpen: this.state.menuOpen,
      menuOpenAttr: this.state.menuOpen ? "true" : "false",
      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
      goSearch: () => { window.location.href = "Search.dc.html"; },
      toggleTheme: () => {
        const next = this.state.theme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("omd-theme", next);
        this.setState({ theme: next });
      },
    };
  }
}
</script>
</body>
</html>
