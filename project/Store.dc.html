    <div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);overflow:hidden;margin-bottom:var(--space-3);"><image-slot id="product-3" placeholder="Product"></image-slot></div>
      <div style="font-family:var(--font-heading);font-size:17px;margin-bottom:var(--space-1);">Coastline Prints (set of 6)</div>
      <div style="font-size:13px;opacity:0.55;margin-bottom:var(--space-3);">$40.00</div>
      <button type="button" class="btn btn-secondary btn-block">Buy on Selar<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg></button>

    <div>
      <div style="aspect-ratio:1;border-radius:var(--radius-md);overflow:hidden;margin-bottom:var(--space-3);"><image-slot id="product-4" placeholder="Product"></image-slot></div>
      <div style="font-family:var(--font-heading);font-size:17px;margin-bottom:var(--space-1);">Essay Template Pack</div>
      <div style="font-size:13px;opacity:0.55;margin-bottom:var(--space-3);">Free</div>
      <button type="button" class="btn btn-secondary btn-block">Download</button>

  </div>

<div class="hr"></div>
<dc-import name="Footer" hint-size="100%,260px"></dc-import>
</div>

</x-dc>

</html>
